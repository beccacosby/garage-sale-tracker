<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Garage Sale Register</title><style>:root{--cream:#f5efe4;--paper:#fffaf2;--ink:#2e2a25;--muted:#786f64;--sage:#8f9b7a;--sage-dark:#667255;--line:#e5dacb;--blush:#d8b7a6;--sand:#d9c6aa}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:linear-gradient(135deg,#efe5d6,#faf6ef);color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:24px}.wrap>h1{font-family:Georgia,serif;font-size:38px;letter-spacing:.04em;text-align:center}.wrap>h1+.muted{text-align:center;margin-bottom:18px}.card{background:rgba(255,250,242,.96);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px #5c4b3820}h1{margin:0 0 4px}.muted{color:var(--muted)}.sellers{display:flex;gap:10px;flex-wrap:wrap}.seller,button{border:0;border-radius:14px;padding:14px 18px;font-size:18px;font-weight:650}.seller{background:#e7ddcf;color:var(--ink);border:1px solid #d8c9b7}.seller:nth-child(3n+2){background:#e4cfc3}.seller:nth-child(3n){background:#d9dfd1}.seller.active{background:var(--sage-dark);color:white;box-shadow:0 5px 14px #66725535}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{font-size:24px;padding:14px;border:1px solid var(--line);background:#fffdf9;color:var(--ink);border-radius:14px;max-width:220px}.primary{background:var(--sage-dark);color:#fff;box-shadow:0 5px 14px #66725530}.secondary{background:#eee5d9;color:var(--ink)}.danger{background:#fee2e2;color:#991b1b}.total{font-size:38px;font-weight:800}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:8px;margin:0 auto 16px;justify-content:center}.tab{background:#e8ded1;color:var(--ink)}.tab.active{background:var(--ink);color:#fff}.hidden{display:none}.sellerTotal{display:flex;justify-content:space-between;font-size:20px;padding:12px 0;border-bottom:1px solid var(--line)}button{cursor:pointer;transition:.15s transform, .15s opacity}button:active{transform:scale(.98);opacity:.9}h2{font-family:Georgia,serif;margin-top:0}.total{font-family:Georgia,serif;color:var(--ink)}@media(min-width:800px){#checkout{display:grid;grid-template-columns:1fr 1fr;gap:16px}#checkout .card{margin-bottom:0}#checkout .card:last-child{grid-column:1/-1}.tabs{position:sticky;top:0;z-index:3;padding:10px;background:#f5efe4dd;backdrop-filter:blur(10px);border-radius:18px}}@media(max-width:600px){.total{font-size:32px}.seller,button{font-size:16px;padding:12px}input{width:100%;max-width:none;box-sizing:border-box}}</style></head><body><div class='wrap'><h1>Garage Sale Register</h1><div class='muted'>Multi-seller checkout — no inventory needed</div><div class='tabs'><button class='tab active' onclick="showTab('checkout',this)">Checkout</button><button class='tab' onclick="showTab('totals',this)">Totals</button><button class='tab' onclick="showTab('history',this)">History</button></div><section id='checkout'><div class='card'><h2>Sellers</h2><div id='sellerButtons' class='sellers'></div><div class='row' style='margin-top:12px'><input id='newSeller' placeholder='Seller name' style='font-size:18px'><button class='secondary' onclick='addSeller()'>+ Add Seller</button></div></div><div class='card'><h2>Add item</h2><div id='selectedLabel' class='muted'>Select a seller first</div><div class='row' style='margin-top:10px'><input id='price' inputmode='decimal' placeholder='$0.00'><button class='primary' onclick='addItem()'>Add Item</button></div></div><div class='card'><h2>Current Customer</h2><div id='items'></div><div class='row' style='justify-content:space-between;margin-top:16px'><b>Customer Total</b><div id='customerTotal' class='total'>$0.00</div></div><div class='row'><input id='cash' inputmode='decimal' placeholder='Cash received'><div><span class='muted'>Change: </span><b id='change'>$0.00</b></div></div><div class='row' style='margin-top:14px'><button class='primary' onclick='completeSale()'>Complete Sale</button><button class='secondary' onclick='clearCurrent()'>Clear Customer</button></div></div></section><section id='totals' class='hidden'><div class='card'><h2>Seller Totals</h2><div id='sellerTotals'></div><div class='row' style='justify-content:space-between;margin-top:15px'><b>All Sales</b><div id='grandTotal' class='total'>$0.00</div></div></div></section><section id='history' class='hidden'><div class='card'><h2>Completed Sales</h2><div id='historyList'></div><button class='danger' onclick='resetDay()'>Reset Entire Sale Day</button></div></section></div><script>let data=JSON.parse(localStorage.getItem('garageSaleData')||'null')||{sellers:[],sales:[]};let current=[],selected=null;const money=n=>'$'+Number(n||0).toFixed(2);function save(){localStorage.setItem('garageSaleData',JSON.stringify(data));render()}function addSeller(){let i=document.getElementById('newSeller'),n=i.value.trim();if(!n)return;if(!data.sellers.includes(n))data.sellers.push(n);i.value='';save()}function selectSeller(n){selected=n;document.getElementById('selectedLabel').textContent='Selected seller: '+n;renderSellers()}function addItem(){let p=parseFloat(document.getElementById('price').value);if(!selected)return alert('Select a seller first.');if(!(p>0))return alert('Enter a price.');current.push({seller:selected,price:p});document.getElementById('price').value='';render()}function removeItem(i){current.splice(i,1);render()}function totalCurrent(){return current.reduce((s,x)=>s+x.price,0)}function clearCurrent(){if(current.length&&!confirm('Clear this customer?'))return;current=[];document.getElementById('cash').value='';render()}function completeSale(){if(!current.length)return alert('Add at least one item.');data.sales.push({time:new Date().toISOString(),items:[...current]});current=[];document.getElementById('cash').value='';save()}function deleteSale(i){if(confirm('Undo this completed sale?')){data.sales.splice(i,1);save()}}function resetDay(){if(confirm('This deletes ALL completed sales and sellers on this device. Continue?')){data={sellers:[],sales:[]};current=[];selected=null;save()}}function renderSellers(){let e=document.getElementById('sellerButtons');e.innerHTML=data.sellers.map(n=>`<button class="seller ${selected===n?'active':''}" onclick='selectSeller(${JSON.stringify(n)})'>${n}</button>`).join('')||'<span class="muted">Add your first seller below.</span>'}function render(){renderSellers();document.getElementById('items').innerHTML=current.map((x,i)=>`<div class='item'><span>${x.seller}</span><span><b>${money(x.price)}</b> <button class='secondary' style='padding:5px 9px;font-size:13px' onclick='removeItem(${i})'>Remove</button></span></div>`).join('')||'<div class="muted">No items yet.</div>';document.getElementById('customerTotal').textContent=money(totalCurrent());let totals={};data.sellers.forEach(n=>totals[n]=0);data.sales.forEach(s=>s.items.forEach(x=>totals[x.seller]=(totals[x.seller]||0)+x.price));document.getElementById('sellerTotals').innerHTML=Object.entries(totals).map(([n,v])=>`<div class='sellerTotal'><span>${n}</span><b>${money(v)}</b></div>`).join('')||'<div class="muted">No sellers yet.</div>';document.getElementById('grandTotal').textContent=money(Object.values(totals).reduce((a,b)=>a+b,0));document.getElementById('historyList').innerHTML=data.sales.slice().reverse().map((s,ri)=>{let i=data.sales.length-1-ri,t=s.items.reduce((a,b)=>a+b.price,0),d=new Date(s.time);return `<div class='item'><span>${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · ${s.items.length} item(s)</span><span><b>${money(t)}</b> <button class='secondary' style='padding:5px 9px;font-size:13px' onclick='deleteSale(${i})'>Undo</button></span></div>`}).join('')||'<div class="muted">No completed sales yet.</div>';calcChange()}function calcChange(){let c=parseFloat(document.getElementById('cash').value)||0,chg=Math.max(0,c-totalCurrent());document.getElementById('change').textContent=money(chg)}document.getElementById('cash').addEventListener('input',calcChange);document.getElementById('price').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()});function showTab(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}render();</script></body></html>
